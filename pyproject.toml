[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lv8py"
version = "0.1.0"
description = "In-process, offline browser environment emulation for Python, powered by V8"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "lv8 Authors" }]
keywords = ["v8", "javascript", "browser", "dom", "emulation", "automation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: JavaScript",
    "Topic :: Software Development :: Interpreters",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff", "build", "wheel"]

[project.urls]
Homepage = "https://github.com/64yuer/lv8"
Issues = "https://github.com/64yuer/lv8/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
